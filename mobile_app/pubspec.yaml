name: vitalis_mobile
description: Application mobile Flutter pour la plateforme VITALIS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # UI
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # Forms
  flutter_form_builder: ^9.1.0
  
  # Utils
  intl: ^0.18.1
  date_format: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/

